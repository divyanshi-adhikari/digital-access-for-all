<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>Digital Divide</title>
    <link rel="manifest" href="manifest.json">
</head>
    <body>
        <script>
            window.location.replace("home.html");
</script>

        <header>
            <h1>Digital Divide PWA</h1>
            <nav>
                <a href="index.html">Government Scheme</a> |
                <a href="scholarship10.html">10th Scholarship</a> |
                <a href="scholarship12.html">12th Scholarship</a> |
                <a href="ration.html">Ration Card</a>
            </nav>
        </header>
        <main>
            <section>
                <h2>User Information Form</h2>
                <p id="offline-status" style="color:green;"></p>

                <form id="govForm"> <!-- Personal Details -->
                
                    <div>
                        <label for="name">Full Name</label><br>
                        <input type="text" id="name" name="name" required>
                    </div><br>
                    <div>
                        <label for="dob">Date of Birth</label>
                        <br>
                        <input type="date" id="dob" name="dob" required>
                    </div><br>
                    
                    <!-- Location Details -->
                    
                    <div>
                        <label for="state">State</label><br>
                        <select id="state" name="state" required>
    <option value="">Select your state</option>
    <option>Andhra Pradesh</option>
    <option>Arunachal Pradesh</option>
    <option>Assam</option>
    <option>Bihar</option>
    <option>Chhattisgarh</option>
    <option>Goa</option>
    <option>Gujarat</option>
    <option>Haryana</option>
    <option>Himachal Pradesh</option>
    <option>Jharkhand</option>
    <option>Karnataka</option>
    <option>Kerala</option>
    <option>Madhya Pradesh</option>
    <option>Maharashtra</option>
    <option>Manipur</option>
    <option>Meghalaya</option>
    <option>Mizoram</option>
    <option>Nagaland</option>
    <option>Odisha</option>
    <option>Punjab</option>
    <option>Rajasthan</option>
    <option>Sikkim</option>
    <option>Tamil Nadu</option>
    <option>Telangana</option>
    <option>Tripura</option>
    <option>Uttar Pradesh</option>
    <option>Uttarakhand</option>
    <option>West Bengal</option>
    </select>
                    </div><br>
                    <div>
                        <label for="city">City / District</label><br>
                        <input type="text" id="city" name="city" required>
                    </div><br>
                    <div>
                        <label for="address">Address</label><br>
                        <textarea id="address" name="address" rows="4" required></textarea>
                    </div><br>
                    
                    <!-- Eligibility Details -->
                    
                    <div>
                        <label for="category">Category</label><br>
                        <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="general">General</option>
                        <option value="sc">SC</option> <option value="st">ST</option>
                        <option value="obc">OBC</option>
                        <option value="ews">EWS</option>
                    </select>
                </div><br>
                <div>
                    <label for="income">Annual Income</label><br>
                    <input type="number" id="income" name="income" required>
                </div><br>
                
                <!-- Action -->
                
                <button type="submit">Save Details</button>
            
            </form>
        </section>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
