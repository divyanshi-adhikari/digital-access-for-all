<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Divide Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #e6ecf0;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            font-size: 42px;
            color: #1f2d3d;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 50px;
            font-size: 18px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card {
            width: 350px;
            height: 180px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            font-size: 22px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .admin {
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
        }

        .user {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: 60px;
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 Digital Divide Portal</h1>
        <div class="subtitle">Empowering communities through accessible digital services</div>

        <div class="card-container">

            <!-- USER CARD -->
            <div class="card user" onclick="openUser()">
                <div class="icon">👤</div>
                User Portal
            </div>

            <!-- ADMIN CARD -->
            <div class="card admin" onclick="openAdmin()">
                <div class="icon">🛠️</div>
                Admin Portal
            </div>

        </div>

        <div class="footer">
            Offline-first PWA • Works without internet
        </div>
    </div>

    <script>
        function openUser() {
            window.location.href = "home.html";
        }

        function openAdmin() {
            window.location.href = "admin-login.html";
        }
    </script>

</body>
</html>
