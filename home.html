<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Divide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 35px;
            color: #555;
            font-size: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card span {
            display: block;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 25px rgba(0,0,0,0.25);
        }

        /* Individual gradients */
        .forms {
            background: linear-gradient(135deg, #0d6efd, #4dabf7);
        }

        .emergency {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
        }

        .community {
            background: linear-gradient(135deg, #198754, #51cf66);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        @media(max-width: 480px) {
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<h1>📱 Digital Divide Portal</h1>
<p class="subtitle">Empowering communities through accessible digital services</p>

<div class="grid">

    <a class="card forms" href="forms.html">
        <span>📄</span>
        Forms & Applications
    </a>

    <a class="card emergency" href="emergency.html">
        <span>🚑</span>
        Emergency & Healthcare
    </a>

    <a class="card community" href="community.html">
        <span>🤝</span>
        Community Sharing
    </a>

</div>

<footer>
    Offline-first PWA • Works without internet
</footer>

</body>
</html>
