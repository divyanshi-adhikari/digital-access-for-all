<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Divide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f2f4f8;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }

    .card {
        border-radius: 14px;
        padding: 25px;
        text-align: center;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 18px rgba(0,0,0,0.25);
    }

    .card span {
        display: block;
        font-size: 40px;
        margin-bottom: 10px;
    }

    /* Individual card colors */
    .scheme { background: #0d6efd; }
    .scholar10 { background: #198754; }
    .scholar12 { background: #6f42c1; }
    .ration { background: #fd7e14; }
    .emergency { background: #dc3545; }

    footer {
        margin-top: 30px;
        text-align: center;
        font-size: 14px;
        color: #666;
    }
    </style>
</head>

<body>

<h1>📱 Digital Divide – Services</h1>

<div class="grid">
    
    <a class="card scheme" href="gov.html">
    <span>🏛️</span>
    Government Scheme
</a>

<a class="card scholar10" href="scholarship10.html">
    <span>🎓</span>
    Class 10 Scholarship
</a>

<a class="card scholar12" href="scholarship12.html">
    <span>🎓</span>
    Class 12 Scholarship
</a>

<a class="card ration" href="ration.html">
    <span>🍚</span>
    Ration Card
</a>

</div>

<footer>
    Works even without internet • Offline-first PWA
</footer>

</body>
</html>
