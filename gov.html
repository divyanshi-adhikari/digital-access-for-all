<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>Digital Divide</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <header>
            <h1>Digital Divide PWA</h1>
            <nav>
                <a href="index.html">Government Scheme</a> |
                <a href="scholarship10.html">10th Scholarship</a> |
                <a href="scholarship12.html">12th Scholarship</a> |
                <a href="ration.html">Ration Card</a>
            </nav>
        </header>
        <main class="page-wrapper">
            
            <div class="page-header">
    <h2>📋 Government Scheme</h2>
    <p>Offline-first application. Data syncs automatically.</p>
            </div>
            
            <div class="form-card">
    <h3>User Information Form</h3>

    <p id="offline-status" style="color:green;"></p>

    <form id="govForm">
        
        <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
        <label for="state">State</label>
        <select id="state" name="state" required>
            <option value="">Select your state</option>
            <option>Andhra Pradesh</option>
    <option>Arunachal Pradesh</option>
    <option>Assam</option>
    <option>Bihar</option>
    <option>Chhattisgarh</option>
    <option>Goa</option>
    <option>Gujarat</option>
    <option>Haryana</option>
    <option>Himachal Pradesh</option>
    <option>Jharkhand</option>
    <option>Karnataka</option>
    <option>Kerala</option>
    <option>Madhya Pradesh</option>
    <option>Maharashtra</option>
    <option>Manipur</option>
    <option>Meghalaya</option>
    <option>Mizoram</option>
    <option>Nagaland</option>
    <option>Odisha</option>
    <option>Punjab</option>
    <option>Rajasthan</option>
    <option>Sikkim</option>
    <option>Tamil Nadu</option>
    <option>Telangana</option>
    <option>Tripura</option>
    <option>Uttar Pradesh</option>
    <option>Uttarakhand</option>
    <option>West Bengal</option>
        </select>
        </div>

        <div class="form-group">
        <label for="city">City / District</label>
        <input type="text" id="city" name="city" required>
        </div>

        <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>
        </div>

        <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Select category</option>
            <option value="general">General</option>
            <option value="sc">SC</option>
            <option value="st">ST</option>
            <option value="obc">OBC</option>
            <option value="ews">EWS</option>
        </select>
        </div>
        
        <div class="form-group">
        <label for="income">Annual Income</label>
        <input type="number" id="income" name="income" required>
        </div>

        <button type="submit" class="primary-btn">Save Details</button>
        
        <p class="helper-text">Offline submissions are saved automatically</p>

    </form>
</div>
</main>
    <script type="module" src="app.js"></script>
</body>
</html>
